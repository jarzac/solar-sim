[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "solar-system-sim"
version = "0.1.0"
description = "A modular desktop solar-system simulation for macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Solar System Sim Contributors" }]
dependencies = [
  "PySide6>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
solar-sim = "solar_sim.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PT", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["solar_sim"]

[tool.hatch.build.targets.wheel]
packages = ["src/solar_sim"]

[tool.hatch.build.targets.sdist]
include = ["src/solar_sim", "tests", "README.md", "AGENTS.md", "pyproject.toml"]
